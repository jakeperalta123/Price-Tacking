[tool.poetry]
name = "price-tacking"
version = "0.1.0"
description = ""
authors = ["Jake <iloveheat1105@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.117.1"}
uvicorn = {extras = ["standard"], version = "^0.37.0"}
sqlalchemy = "^2.0.43"
psycopg2 = "^2.9.10"
pydantic = "^2.11.9"
alembic = "^1.16.5"
python-jose = "^3.5.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
beautifulsoup4 = "^4.14.3"
redis = "<6.5"
celery = {extras = ["redis"], version = "^5.6.2"}
requests = "^2.32.5"
pydantic-settings = "^2.13.1"
aioresponses = "^0.7.8"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.1"


[tool.poetry.group.dev.dependencies]
fakeredis = "^2.34.1"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
